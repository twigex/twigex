<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{.NotificationTitle}}</title>
</head>

<body style="margin: 0; padding: 0; background-color: #F1F5F9; -webkit-font-smoothing: antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F1F5F9"
        style="background-color: #F1F5F9;">
        <tr>
            <td align="center" style="padding: 40px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                    style="width: 600px; max-width: 100%; background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <tr>
                        <td align="center" style="padding: 36px 40px 0;">
                            <img src="{{.Logo}}" width="132" alt=""
                                style="display: block; border: 0; outline: none; text-decoration: none;">
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 28px 48px 0;">
                            <p
                                style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #94A3B8;">
                                {{.NotificationText}}</p>
                            <h1 style="margin: 8px 0 0; font-size: 21px; line-height: 28px; font-weight: 600; color: #0F172A;">
                                {{.NotificationTitle}}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 48px 0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px;">
                                <tr>
                                    <td style="padding: 18px 20px;">
                                        <p style="margin: 0; font-size: 14px; line-height: 20px;">
                                            <span style="font-weight: 600; color: #334155;">{{.Sender}}</span>
                                            <span style="color: #94A3B8; font-size: 12px; margin-left: 4px;">{{ getDate .CreatedAt}}</span>
                                        </p>
                                        <pre
                                            style="margin: 10px 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 22px; color: #475569; white-space: pre-wrap; word-wrap: break-word;">{{.Message}}</pre>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 28px 48px 40px;">
                            <a href="{{.Link}}"
                                style="display: inline-block; background-color: {{.ButtonColor}}; color: #FFFFFF; font-size: 15px; font-weight: 600; line-height: 20px; text-decoration: none; padding: 13px 32px; border-radius: 10px;">
                                {{.Action}}
                            </a>
                        </td>
                    </tr>
                    <tr>
                        {{template "email_footer" . }}
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
