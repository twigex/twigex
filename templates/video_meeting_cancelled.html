<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{.Title}}</title>
</head>

<body style="margin: 0; padding: 0; background-color: #F1F5F9; -webkit-font-smoothing: antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F1F5F9"
        style="background-color: #F1F5F9;">
        <tr>
            <td align="center" style="padding: 40px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                    style="width: 600px; max-width: 100%; background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <tr>
                        <td align="center" style="padding: 36px 40px 0;">
                            <img src="{{.Logo}}" width="132" alt=""
                                style="display: block; border: 0; outline: none; text-decoration: none;">
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 28px 48px 0;">
                            <h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; color: #0F172A;">
                                {{.Title}}</h1>
                            <p style="margin: 12px 0 0; font-size: 15px; line-height: 24px; color: #64748B;">{{.Text}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 48px 40px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px;">
                                <tr>
                                    <td align="center" style="padding: 18px 24px;">
                                        <p style="margin: 0; font-size: 15px; line-height: 24px; color: #334155;">
                                            {{.CancelLine}}</p>
                                        {{if .WasScheduledLine}}
                                        <p
                                            style="margin: 8px 0 0; font-size: 13px; line-height: 20px; color: #94A3B8; text-decoration: line-through;">
                                            {{.WasScheduledLine}}</p>
                                        {{end}}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        {{template "email_footer" . }}
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
